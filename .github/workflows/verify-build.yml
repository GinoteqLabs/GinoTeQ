name: Verify Ginoteq Website Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Verify branded favicon and routes
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          grep -q "data:image/jpeg;base64" dist/favicon.svg
          grep -q "ginoteq-brand-g-20260909" dist/index.html

      - name: Verify photographic hero and responsive source
        run: |
          test -s dist/assets/ginoteq-video-poster.webp
          grep -q 'gino-photo-hero' src/pages/HomePage.jsx
          grep -q 'GINOTEQ_PHOTOGRAPHIC_HERO_V2' src/index.css
          grep -q 'Explore Our Work' src/pages/HomePage.jsx

      - name: Verify moving cinematic hero
        run: |
          grep -q 'GINOTEQ_CINEMATIC_VIDEO_V1' src/pages/HomePage.jsx
          grep -q 'gino-video-backdrop' src/index.css
          test -s dist/assets/ginoteq-cinematic-hero.webp
          grep -Rlq '1f8b2e43-28a9-4023-a8fe-b7021a42be66.mp4' dist/assets
